<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tutores - Panel de Seleccion</title>
    <link rel="stylesheet" href="../CSS/MisTutores.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <button class="nav-btn active">
                    <i class="fa-solid fa-house"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-address-card"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-star"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-envelope"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-book-open"></i>
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="main-title">Mis Tutores</h1>

            <section class="toolbar">
                <select class="filter-dropdown">
                    <option value="calificacion">Calificación</option>
                    <option value="5_estrellas">5 Estrellas</option>
                    <option value="4_estrellas">4 Estrellas</option>
                    <option value="3_estrellas">3 Estrellas</option>
                    <option value="2_estrellas">2 Estrellas</option>
                    <option value="1_estrella">1 Estrella</option>
                </select>
                
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Buscar tutor por nombre...">
                    <button class="search-button">Buscar</button>
                </div>
                
                <select class="filter-dropdown subjects-dropdown">
                    <option value="materias">Materias</option>
                    <option value="matematicas">Matemáticas</option>
                    <option value="programacion">Programación</option>
                    <option value="quimica">Química</option>
                    <option value="medicina">Medicina</option>
                    <option value="biologia">Biología</option>
                    <option value="ingles">Inglés</option>
                </select>
            </section>

            <section class="tutor-grid">
                <div class="tutor-card">
                    <div class="photo-placeholder"><i class="fa-solid fa-user"></i></div>
                    <div class="card-info">
                        <p class="tutor-name">Juan Perez</p>
                        <p class="tutor-subject">Matemáticas</p>
                        <div class="status-bar"></div>
                    </div>
                </div>
                <div class="tutor-card">
                    <div class="photo-placeholder"><i class="fa-solid fa-user"></i></div>
                    <div class="card-info">
                        <p class="tutor-name">Annette Garcia</p>
                        <p class="tutor-subject">Programación</p>
                        <div class="status-bar"></div>
                    </div>
                </div>
                <div class="tutor-card">
                    <div class="photo-placeholder"><i class="fa-solid fa-user"></i></div>
                    <div class="card-info">
                        <p class="tutor-name">Carlos Ruiz</p>
                        <p class="tutor-subject">Química</p>
                        <div class="status-bar"></div>
                    </div>
                </div>
                <div class="tutor-card">
                    <div class="photo-placeholder"><i class="fa-solid fa-user"></i></div>
                    <div class="card-info">
                        <p class="tutor-name">Angelica Tequida</p>
                        <p class="tutor-subject">Inglés</p>
                        <div class="status-bar"></div>
                    </div>
                </div>
                <div class="tutor-card">
                    <div class="photo-placeholder"><i class="fa-solid fa-user"></i></div>
                    <div class="card-info">
                        <p class="tutor-name">Rodolfo Sanz</p>
                        <p class="tutor-subject">Biologia</p>
                        <div class="status-bar"></div>
                    </div>
                </div>
                <div class="tutor-card">
                    <div class="photo-placeholder"><i class="fa-solid fa-user"></i></div>
                    <div class="card-info">
                        <p class="tutor-name">Lucia Fernandez</p>
                        <p class="tutor-subject">Medicina</p>
                        <div class="status-bar"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
