<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Archivos</title>
    <link rel="stylesheet" href="../CSS/Archivos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <button class="nav-btn">
                    <i class="fa-solid fa-house"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-address-card"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-star"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-envelope"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="nav-btn active">
                    <i class="fa-solid fa-book-open"></i>
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <section class="banner-orange">
                <h1>TUS ARCHIVOS ACUMULADOS</h1>
                <p>Busca tus archivos y apuntes descargados de tus conversaciones.</p>
                <button class="btn-messenger">Ir a mensajería</button>
            </section>

            <section class="filters-bar">
                <select class="filter-select"><option>ESCOGE TUTOR</option></select>
                <select class="filter-select"><option>TIPO DE ARCHIVO</option></select>
            </section>

            <div class="files-grid">
                <div class="file-card">
                    <div class="file-preview"></div>
                    <h3>Nombre de archivo</h3>
                    <p>Resumen del contenido del archivo para vista previa...</p>
                    <div class="file-footer">
                        <i class="fa-solid fa-download"></i>
                        <small>2MB</small>
                    </div>
                </div>
                <div class="file-card">
                    <div class="file-preview"></div>
                    <h3>Nombre de archivo</h3>
                    <p>Resumen del contenido del archivo para vista previa...</p>
                    <div class="file-footer">
                        <i class="fa-solid fa-download"></i>
                        <small>5MB</small>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
