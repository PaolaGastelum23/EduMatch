<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Califica a tu Tutor</title>
    <link rel="stylesheet" href="../CSS/CalificaTutor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <button class="nav-btn">
                    <i class="fa-solid fa-house"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-address-card"></i>
                </button>
                <button class="nav-btn active">
                    <i class="fa-solid fa-star"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-envelope"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="nav-btn">
                    <i class="fa-solid fa-book-open"></i>
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header-section">
                <h1 class="main-title">
                   
                    CALIFICA A TU TUTOR 
                    
                </h1>
            </header>

            <section class="selection-section">
                <select class="tutor-select">
                    <option>ESCOGE TUTOR</option>
                    <option>Tutor Juan Perez</option>
                    <option>Tutora Maria Lopez</option>
                </select>
            </section>

            <section class="rating-grid">
                <div class="rating-card">
                    <h3>Puntualidad</h3>
    <div class="stars" data-category="puntualidad">
        <i class="fa-regular fa-star estrella-btn" data-value="1"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="2"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="3"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="4"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="5"></i>
    </div>
                </div>
                <div class="rating-card">
                    <h3>Materiales compartidos</h3>
     <div class="stars" data-category="puntualidad">
        <i class="fa-regular fa-star estrella-btn" data-value="1"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="2"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="3"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="4"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="5"></i>
    </div>
                </div>
                <div class="rating-card">
                     <h3>Cooperación</h3>
<div class="stars" data-category="puntualidad">
        <i class="fa-regular fa-star estrella-btn" data-value="1"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="2"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="3"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="4"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="5"></i>
    </div>
                </div>
                <div class="rating-card">
                    <h3>Comunicación</h3>
<div class="stars" data-category="puntualidad">
        <i class="fa-regular fa-star estrella-btn" data-value="1"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="2"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="3"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="4"></i>
        <i class="fa-regular fa-star estrella-btn" data-value="5"></i>
    </div>
                </div>
            </section>

            <section class="comment-section">
                <label>Deja un comentario de tu experiencia</label>
                <textarea class="comment-box" placeholder="Escribe aquí tu opinión..."></textarea>
            </section>

            <footer class="action-footer">
                <button class="btn-enviar">Enviar</button>
                <p class="warning-text">Una vez mandada su opinión no se podrá modificar hasta 2 semanas posteriores</p>
            </footer>
        </main>
    </div>
    <script src="/JS/calificaTutor.js"></script>
</body>
</html>
