<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="\css\registro.css">

    <title>Document</title>

<body>
     <!-- registro de alumnos-->
     <section class="registro-alumnos" id="RegitroA">
     <div class="linea"></div>
  <a href="/Inicio\index.html" class="boton-regresar">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
     <div class="registro-container">
    
         <h1>NUEVO <br>
            REGISTRO</h1>
         <!-- Contenido del formulario de registro -->
        <form class="regitros-forma">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label>Tu carrera:</label>
            <select name="carrera" id="carrera" required>
                <option value="">Selecciona tu carrera</option>
                <option value="ingenieria">Ingeniería en Sistemas Computacionales</option>
                <option value="administracion">Administración de Empresas</option>
                <option value="psicologia">Psicología</option>
                <option value="derecho">Derecho</option>
                <option value="medicina">Medicina</option>
            </select>
            <label>plantel</label>
            <select name="plantel" id="plantel" required>
                <option value="">Selecciona tu plantel</option>
                <option value="Hermosillo">Hermosillo</option>
                <option value="Ures">Ures</option>
                <option value="Nabojoa">Nabojoa</option>
                <option value="Magdalena">Magdalena</option>
            </select>
            <label>Expediente Estudiantil:</label>
            <input type="number" id="expediente" name="expediente" required>

            <label>Seleccione las materias que te interesen:</label>
            </form> </div>
        
         <div class="titulo-ma">
    
</div>
            <!-- los botones de materia -->

             <div class="posiscion">
             <div class="meterias-container">

                <button type="button" class="materia-items">
                    <i class="fa-solid fa-calculator"></i>
                    <span>Matemáticas</span>
                </button>

                <button type="button" class="materia-items">
                    <i class="fa-solid fa-code"></i>
                    <span>Codigo</span>
                </button>

                <button type="button" class="materia-items">
                    <i class="fa-solid fa-book-medical"></i>
                    <span>Medicina</span>
                </button>

                <button type="button" class="materia-items">
                    <i class="fa-solid fa-users"></i>
                    <span>Social</span>
                </button>

                <button type="button" class="materia-items">
                    <i class="fa-solid fa-robot"></i>
                    <span>Robotica</span>
                </button>

                <button type="button"type="button" class="materia-items">
                    <i class="fa-solid fa-atom"></i>
                    <span>Química</span>
                </button>

            <button type="button" class="materia-items">
                   <i class="fa-solid fa-infinity"></i>
                    <span>Física</span>
                </button>

                <button type="button" class="materia-items">
                    <i class="fa-solid fa-globe"></i>
                    <span>Geografía</span>
                </button>

                <button type="button" class="materia-items">
                    <i class="fa-solid fa-language"></i>
                    <span>Idiomas</span>
                </button>
             </div>
    </div>
    <div id="mensaje-error" class="mensaje-error"></div>
    <button type="button" class="btn-registro">Iniciar</button>
   
</section>
