                <option value="administracion">Matematicas</option>

                <option value="derecho">Social</option>

                <option value="robotica">Robotica</option>

                <option value="geografia">Geografía</option>

            </select>

            <label>Tu Semestre</label>

            </select>

             <div class="separacion"></div>

            <label>plantel</label>

      <i class="fas fa-comment-dots"></i>
