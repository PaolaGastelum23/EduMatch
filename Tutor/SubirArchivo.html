<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Archivos</title>
    <style>
        /* EL CSS VA AQUÍ DENTRO */
        :root {
            --main-red: #660000;
            --bg-light: #f2f2f2;
            --card-bg: #d9d9d9;
        }

        body {
            background-color: white;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* panel Izquierdo */
        .grid-section {
            background-color: var(--main-red);
            border-radius: 20px;
            padding: 30px;
            flex: 2.5;
        }

        .header-pdf h2 {
            color: white;
            text-align: right;
            margin-top: 0;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }

        .thumbnail {
            background-color: #444;
            height: 120px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .file-name {
            font-size: 0.9rem;
            margin: 5px 0;
            color: #333;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .shared-section {
            background-color: #f0ecec;
            border-radius: 20px;
            padding: 20px;
            flex: 1;
            height: fit-content;
        }

        .shared-section h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        .shared-item {
            background-color: var(--card-bg);
            display: flex;
            padding: 15px;
            margin-bottom: 15px;
            gap: 12px;
            border-radius: 10px;
        }

        .shared-thumb {
            width: 70px;
            height: 70px;
            background: #444;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .shared-info p {
            margin: 0;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .shared-info small {
            display: block;
            margin: 5px 0;
            color: #555;
        }

        .btn-download {
            background-color: var(--main-red);
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* colores de las miniaturas */
        .thumbnail.pdf {
            background-color: #ff4d4d;
        }

        /* Rojo para PDF */
        .thumbnail.word {
            background-color: #4d94ff;
        }

        /* Azul para Word */
        .thumbnail.excel {
            background-color: #2eb82e;
        }

        /* Verde para Excel */
        .thumbnail {
            height: 120px;
            border-radius: 15px;
            margin-bottom: 10px;
            background-size: 50px;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }

        /* Icono para PDF */
        .thumbnail.pdf {
            background-image: url('https://cdn-icons-png.flaticon.com/512/337/337946.png');
            background-color: #fff1f1;
        }

        /* Icono para Word*/
        .thumbnail.word {
            background-image: url('https://cdn-icons-png.flaticon.com/512/888/888883.png');
            background-color: #eef4ff;
            background-size: 55px;
            /* Ajuste ligero de tamaño */
        }

        /* Icono para excel*/
        .thumbnail.excel {
            background-image: url('https://cdn-icons-png.flaticon.com/512/888/888850.png');
            background-color: #efffef;
            background-size: 55px;
        }


        /* como se ven los compartidos */
        .shared-thumb {
            width: 60px;
            height: 60px;
            background-size: 30px;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('https://cdn-icons-png.flaticon.com/512/337/337946.png');
            /* PDF por defecto */
            background-color: #fff;
            border-radius: 10px;
            flex-shrink: 0;
        }


        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }


        .main-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container {
            display: flex;
            align-items: center;
            background-color: #d9d9d9;
            border-radius: 30px;
            padding: 5px 15px;
            width: 300px;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            height: 30px;
        }

        .search-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .btn-upload-new {
            background-color: #660000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* filtro del pdf */
        .header-pdf {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background: none;
            color: white;
            padding: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 120px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 8px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
        }

        .dropdown-content a:hover {
            background-color: #ddd;
            border-radius: 8px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            opacity: 0.8;
        }

        /* parte responsiva */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="container-principal">

        <h1 class="main-title">Tus archivos</h1>

        <div class="top-bar">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar archivo..."
                    onkeyup="buscarArchivos()">
            </div>

            <!-- solo va a acepatar ese tipo de archivos solamente-->
            <input type="file" id="file-upload" style="display: none;" accept=".pdf, .doc, .docx, .xls, .xlsx" />


            <button class="btn-upload-new" onclick="document.getElementById('file-upload').click()">
                subir un archivo nuevo
            </button>
        </div>

        <div class="main-container">

            <section class="grid-section">
                <div class="header-pdf">
                    <div class="dropdown">
                        <button class="dropbtn" id="currentFilter">TODOS ▼</button>
                        <div class="dropdown-content">
                            <a href="#" onclick="filtrarArchivos('Todos')">Todos</a>
                            <a href="#" onclick="filtrarArchivos('PDF')">PDF</a>
                            <a href="#" onclick="filtrarArchivos('Word')">Word</a>
                            <a href="#" onclick="filtrarArchivos('Excel')">Excel</a>
                        </div>
                    </div>
                </div>

                <div class="cards-grid" id="archivoGrid">
                    <div class="card" data-type="PDF">
                        <div class="thumbnail pdf"></div>
                        <p class="file-name">Guia_Estudio.pdf</p>
                        <!--<div class="card-footer"><span>❤️</span><span>🚩</span></div> --->
                    </div>
                    <div class="card" data-type="Word">
                        <div class="thumbnail word"></div>
                        <p class="file-name">Guía_CRUD.docx</p>
                        <!--<div class="card-footer"><span>❤️</span><span>🚩</span></div> --->
                    </div>
                    <div class="card" data-type="Excel">
                        <div class="thumbnail excel"></div>
                        <p class="file-name">Diagrama_PERT.xlsx</p>
                        <!--<div class="card-footer"><span>❤️</span><span>🚩</span></div> --->
                    </div>
                    <!-- Agregué más para llenar el grid -->
                    <div class="card" data-type="PDF">
                        <div class="thumbnail pdf"></div>
                        <p class="file-name">Explicación_UbuntuServer.pdf</p>
                        <!--<div class="card-footer"><span>❤️</span><span>🚩</span></div> --->
                    </div>
                </div>
            </section>


            <!-- Parte de los compartidos -->
            <aside class="shared-section">
                <h3>Archivos compartidos</h3>

                <div class="shared-item">
                    <div class="shared-thumb"></div>
                    <div class="shared-info">
                        <p>Apuntes de Cálculo</p>
                        <small>Compartido por: Lorena Martinez</small>
                        <button class="btn-download" onclick="descargarPDF('Apuntes_Calculo.pdf')">Descargar</button>
                    </div>
                </div>

                <div class="shared-item">
                    <div class="shared-thumb"></div>
                    <div class="shared-info">
                        <p>Guía de Historia</p>
                        <small>Compartido por: Glenda Benítez</small>
                        <button class="btn-download" onclick="descargarPDF('Guia_Historia.pdf')">Descargar</button>
                    </div>
                </div>

                <div class="shared-item">
                    <div class="shared-thumb"></div>
                    <div class="shared-info">
                        <p>Resumen Literario</p>
                        <small>Compartido por: Jaqueline Guzmán</small>
                        <button class="btn-download" onclick="descargarPDF('Resumen_Literatura.pdf')">Descargar</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    <script>
        function filtrarArchivos(tipo) {

            document.getElementById('currentFilter').innerText = tipo + " ▼";

            const tarjetas = document.querySelectorAll('.card');

            tarjetas.forEach(tarjeta => {

                if (tipo === 'Todos' || tarjeta.getAttribute('data-type') === tipo) {
                    tarjeta.style.display = "block";
                } else {
                    tarjeta.style.display = "none";
                }
            });
        }

        function buscarArchivos() {

            const textoBusqueda = document.getElementById('searchInput').value.toLowerCase();

            const tarjetas = document.querySelectorAll('.card');

            tarjetas.forEach(tarjeta => {

                const nombreArchivo = tarjeta.querySelector('.file-name').innerText.toLowerCase();

                if (nombreArchivo.includes(textoBusqueda)) {
                    tarjeta.style.display = "block";
                } else {
                    tarjeta.style.display = "none";
                }
            });
        }

        function descargarPDF(nombreArchivo) {

            const contenidoFalso = "%PDF-1.4\n1 0 obj\n<< /Title (Archivo Simulado) >>\nendobj\ntrailer\n<< /Root 1 0 R >>\n%%EOF";
            const blob = new Blob([contenidoFalso], { type: 'application/pdf' });

            const enlace = document.createElement('a');
            enlace.href = URL.createObjectURL(blob);
            enlace.download = nombreArchivo;

            document.body.appendChild(enlace);
            enlace.click();

            document.body.removeChild(enlace);
        }

    </script>
</body>
</html>
